name: Safe fixture checks
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install uv==0.10.2
      - run: uv sync --locked
      - run: uv run --locked python scripts/fixture_smoke.py
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked mypy --ignore-missing-imports --explicit-package-bases src/payment_integrity scripts
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run test
      - run: npm --prefix web run build
