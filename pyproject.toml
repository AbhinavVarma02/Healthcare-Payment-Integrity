[project]
name = "healthcare-payment-integrity"
version = "1.0.0"
description = "Local CERT audit policy research and analyst tooling"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.4,<2",
    "fastapi>=0.129,<1",
    "filelock>=3.24,<5",
    "numpy>=2.4,<3",
    "pandas>=3,<4",
    "scikit-learn>=1.8,<2",
    "scipy>=1.17,<2",
    "threadpoolctl>=3.6,<4",
    "uvicorn>=0.41,<1",
    "xgboost>=3.2,<4",
]

[dependency-groups]
dev = [
    "coverage==7.17.5",
    "httpx>=0.28,<1",
    "hypothesis>=6,<7",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
    "mypy>=1.19,<2",
    "pip-audit>=2.10,<3",
    "psutil>=7,<8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 108
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "PLW1510"]
